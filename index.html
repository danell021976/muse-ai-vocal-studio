<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MuseAI - Professional Production Suite</title>
    <style>
        :root {
            --bg-main: #060409; --bg-sidebar: #0b0914; --bg-panel: rgba(20, 16, 38, 0.45);
            --border-glow: rgba(168, 85, 247, 0.2); --accent-purple: #a855f7;
            --accent-cyan: #06b6d4; --text-main: #f8fafc; --text-muted: #94a3b8;
            --warning-red: #ef4444;
        }
        body { font-family: sans-serif; background: var(--bg-main); color: var(--text-main); margin: 0; padding: 0; display: flex; min-height: 100vh; overflow: hidden; }
        .sidebar { width: 220px; background: var(--bg-sidebar); border-right: 1px solid var(--border-glow); padding: 24px 16px; display: flex; flex-direction: column; justify-content: space-between; }
        .logo { font-size: 22px; font-weight: 800; color: #38bdf8; letter-spacing: 1px; margin-bottom: 30px; padding-left: 12px; }
        .nav-links { display: flex; flex-direction: column; gap: 8px; flex: 1; }
        .nav-item { padding: 12px 16px; border-radius: 8px; color: var(--text-muted); text-decoration: none; font-size: 14px; display: flex; align-items: center; gap: 12px; font-weight: 500; cursor: pointer; }
        .nav-item.active, .nav-item:hover { background: rgba(168, 85, 247, 0.12); color: var(--text-main); border-left: 3px solid var(--accent-purple); }
        .user-badge { padding: 12px; background: rgba(255,255,255,0.03); border-radius: 10px; border: 1px solid rgba(255,255,255,0.05); font-size: 12px; }
        .main-workspace { flex: 1; display: flex; height: 100vh; }
        .creator-column { width: 360px; min-width: 360px; background: rgba(13, 10, 26, 0.4); border-right: 1px solid var(--border-glow); padding: 30px 24px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; box-sizing: border-box; }
        .control-group { display: flex; flex-direction: column; gap: 8px; }
        .label-row { display: flex; justify-content: space-between; align-items: center; }
        label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: #cbd5e1; }
        .title-warning { font-size: 10px; color: var(--warning-red); font-weight: bold; display: none; text-transform: uppercase; letter-spacing: 0.5px; }
        input, textarea { width: 100%; padding: 12px; background: #090714; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 10px; color: #fff; font-size: 13px; box-sizing: border-box; font-family: inherit; resize: none; transition: border-color 0.2s; }
        input:focus, textarea:focus { outline: none; border-color: var(--accent-purple); }
        input.input-error { border-color: var(--warning-red); background: rgba(239, 68, 68, 0.02); }
        .tags-row { display: flex; gap: 6px; flex-wrap: wrap; }
        .preset-tag { background: rgba(168, 85, 247, 0.05); border: 1px solid rgba(168, 85, 247, 0.15); padding: 4px 10px; border-radius: 15px; font-size: 11px; color: #c084fc; cursor: pointer; }
        .action-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--accent-purple) 0%, #7e22ce 100%); color: white; border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 15px rgba(168,85,247,0.2); }
        .action-btn:disabled { background: #1e1b29; color: #475569; cursor: not-allowed; box-shadow: none; }
        .library-column { flex: 1; padding: 30px 40px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; box-sizing: border-box; }
        .lib-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 15px; }
        .lib-tabs { display: flex; gap: 20px; }
        .lib-tab { font-size: 15px; font-weight: 600; color: var(--text-muted); cursor: pointer; }
        .lib-tab.active { color: var(--text-main); border-bottom: 2px solid var(--accent-purple); padding-bottom: 10px; }
        .search-filter-row { display: flex; gap: 15px; align-items: center; }
        .search-box { flex: 1; }
        .filter-btn { background: #16122b; border: 1px solid rgba(255,255,255,0.05); color: var(--text-main); padding: 10px 16px; border-radius: 8px; font-size: 13px; cursor: pointer; }
        .tracks-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
        .track-card { background: var(--bg-panel); border: 1px solid var(--border-glow); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; cursor: pointer; transition: all 0.2s; }
        .card-wave-art { height: 45px; background: linear-gradient(90deg, rgba(6,182,212,0.15) 0%, rgba(168, 85, 247, 0.15) 100%); border-radius: 6px; display: flex; align-items: center; justify-content: center; }
        .card-wave-bars { display: flex; gap: 3px; }
        .wave-bar { width: 3px; height: 16px; background: var(--accent-purple); border-radius: 2px; }
        .card-details { display: flex; flex-direction: column; gap: 4px; }
        .card-title { font-size: 14px; font-weight: 600; color: #fff; }
        .card-style { font-size: 11px; color: var(--text-muted); }
        .card-actions { display: flex; gap: 8px; margin-top: 5px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 10px; }
        .action-icon-btn { flex: 1; padding: 6px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 6px; color: var(--text-muted); font-size: 11px; font-weight: 600; cursor: pointer; text-align: center; text-decoration: none; transition: all 0.2s; }
        .action-icon-btn:hover { background: rgba(6, 182, 212, 0.15); color: #fff; border-color: var(--accent-cyan); }
        .action-icon-btn.lib-added { background: rgba(168, 85, 247, 0.2); color: #fff; border-color: var(--accent-purple); }
        .player-bar { position: absolute; bottom: 0; left: 0; right: 0; background: #0d0a1a; border-top: 1px solid var(--border-glow); padding: 16px 40px; display: flex; align-items: center; gap: 30px; height: 75px; box-sizing: border-box; }
        .player-info { width: 200px; display: flex; flex-direction: column; gap: 4px; }
        .player-title { font-size: 13px; font-weight: 600; color: #fff; }
        .player-status { font-size: 11px; color: var(--accent-cyan); }
        .audio-wrapper { flex: 1; }
        audio { width: 100%; filter: invert(0.9) hue-rotate(180deg); }
        #status-info { font-size: 12px; color: var(--text-muted); text-align: center; margin-top: 10px; }
        .spinner { display: none; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.1); border-radius: 50%; border-top-color: var(--accent-cyan); animation: spin 1s linear infinite; margin: 10px auto 0 auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="sidebar">
    <div class="logo">MUSE AI</div>
    <div class="nav-links">
        <a href="#" class="nav-item active">➕ Create Studio</a>
        <a href="#" class="nav-item">🧭 Explore Tracks</a>
        <a href="#" class="nav-item" onclick="filterToWorkspace()">📚 My Workspace</a>
    </div>
    <div class="user-badge"><div style="font-weight:600; color:#fff;">Developer Studio</div><div style="color:var(--text-muted); font-size:11px; margin-top:2px;">Plan: Sandbox Unlimited</div></div>
</div>
<div class="main-workspace">
    <div class="creator-column">
        <div class="control-group">
            <div class="label-row">
                <label>Song Title</label>
                <span id="titleWarningText" class="title-warning">⚠️ Title Mandatory</span>
            </div>
            <input type="text" id="trackTitle" placeholder="Enter title to unlock studio..." oninput="validateFormTitle()">
        </div>
        <div class="control-group">
            <label>Track Style & Aesthetics</label>
            <input type="text" id="prompt" value="Dark atmospheric techno with male vocals, slow chill progression.">
            <div class="tags-row">
                <span class="preset-tag" onclick="document.getElementById('prompt').value='Synthwave, 80s bass, electronic drums'">#Synthwave</span>
                <span class="preset-tag" onclick="document.getElementById('prompt').value='Chill lofi hiphop beats, saxophone jazz'">#LofiJazz</span>
            </div>
        </div>
        <div class="control-group">
            <label>Vocal Lyrics Engine Input</label>
            <textarea id="lyrics" rows="6">[Outro]&#10;[M] Ooh...&#10;The room goes still&#10;The glass runs dry&#10;I'm left with you&#10;And a blacked-out sky</textarea>
        </div>
        <button id="genBtn" class="action-btn" onclick="generateMusic()">Create Track Array</button>
        <div id="status-info">Ready to arrange matrix.</div>
        <div id="loader" class="spinner"></div>
    </div>
    <div class="library-column">
        <div class="lib-header"><div class="lib-tabs"><span class="lib-tab active" id="tabAll" onclick="showAllTracks()">All Tracks</span><span class="lib-tab" id="tabWork" onclick="filterToWorkspace()">My Workspace / Library</span></div></div>
        <div class="search-filter-row"><div class="search-box"><input type="text" placeholder="Search master index..."></div><button class="filter-btn">Filters (0) ▾</button><button class="filter-btn">Sorting ▾</button></div>
        <div id="tracksGrid" class="tracks-grid"></div>
    </div>
</div>
<div class="player-bar">
    <div class="player-info"><div id="pTitle" class="player-title">No Audio Loaded</div><div id="pStatus" class="player-status">System Standby</div></div>
    <div class="audio-wrapper"><audio id="audioPlayer" controls></audio></div>
</div>
<script>
    let workspaceList = [];

    function validateFormTitle() {
        const titleField = document.getElementById('trackTitle');
        const warnText = document.getElementById('titleWarningText');
        const btn = document.getElementById('genBtn');
        
        if (titleField.value.trim() === "") {
            titleField.classList.add('input-error');
            warnText.style.display = 'block';
            btn.disabled = true;
            btn.innerText = "Please Enter Song Title First";
        } else {
            titleField.classList.remove('input-error');
            warnText.style.display = 'none';
            btn.disabled = false;
            btn.innerText = "Create Track Array";
        }
    }

    function showAllTracks() {
        document.getElementById('tabAll').classList.add('active');
        document.getElementById('tabWork').classList.remove('active');
        const cards = document.querySelectorAll('.track-card');
        cards.forEach(c => c.style.display = 'flex');
    }

    function filterToWorkspace() {
        document.getElementById('tabAll').classList.remove('active');
        document.getElementById('tabWork').classList.add('active');
        const cards = document.querySelectorAll('.track-card');
        cards.forEach(c => {
            if (workspaceList.includes(c.id)) c.style.display = 'flex';
            else c.style.display = 'none';
        });
    }

    function toggleWorkspace(e, id) {
        e.stopPropagation();
        const btn = document.getElementById('btn-lib-' + id);
        if (workspaceList.includes(id)) {
            workspaceList = workspaceList.filter(item => item !== id);
            btn.classList.remove('lib-added');
            btn.innerText = "📁 Add to Lib";
        } else {
            workspaceList.push(id);
            btn.classList.add('lib-added');
            btn.innerText = "✅ In Library";
        }
        saveCurrentLibraryState();
    }

    function shareTrack(e, url) {
        e.stopPropagation();
        const shareLink = window.location.origin + url;
        navigator.clipboard.writeText(shareLink);
        alert("✨ Share link copied to your clipboard!\nLink: " + shareLink);
    }

    function bindCardEvents(card) {
        card.onclick = function() {
            const audioPlayer = document.getElementById('audioPlayer');
            const src = this.getAttribute('data-audio-src');
            const title = this.getAttribute('data-track-title');
            if (src) {
                audioPlayer.src = src;
                document.getElementById('pTitle').innerText = title || "Custom AI Track";
                document.getElementById('pStatus').innerText = "Playing Asset";
                audioPlayer.play();
            }
        };
    }

    function saveCurrentLibraryState() {
        const gridHTML = document.getElementById('tracksGrid').innerHTML;
        localStorage.setItem('muse_ai_library', gridHTML);
        localStorage.setItem('muse_ai_workspace_list', JSON.stringify(workspaceList));
    }

    function loadSavedLibraryAndInputs() {
        const savedCards = localStorage.getItem('muse_ai_library');
        const savedList = localStorage.getItem('muse_ai_workspace_list');
        
        const savedTitle = localStorage.getItem('muse_ai_draft_title');
        const savedPrompt = localStorage.getItem('muse_ai_draft_prompt');
        const savedLyrics = localStorage.getItem('muse_ai_draft_lyrics');

        if (savedTitle !== null) document.getElementById('trackTitle').value = savedTitle;
        if (savedPrompt !== null) document.getElementById('prompt').value = savedPrompt;
        if (savedLyrics !== null) document.getElementById('lyrics').value = savedLyrics;

        if (savedCards) {
            document.getElementById('tracksGrid').innerHTML = savedCards;
            if (savedList) workspaceList = JSON.parse(savedList);
            const cards = document.querySelectorAll('.track-card');
            cards.forEach(card => bindCardEvents(card));
        }
    }

    async function generateMusic() {
        const titleInput = document.getElementById('trackTitle').value.trim();
        const prompt = document.getElementById('prompt').value.trim();
        const lyrics = document.getElementById('lyrics').value.trim();
        const status = document.getElementById('status-info');
        const loader = document.getElementById('loader');
        const audioPlayer = document.getElementById('audioPlayer');
        const btn = document.getElementById('genBtn');
        const grid = document.getElementById('tracksGrid');
        const pTitle = document.getElementById('pTitle');
        const pStatus = document.getElementById('pStatus');

        if (!titleInput || !prompt || !lyrics) return alert("Fields cannot be blank!");
        
        btn.disabled = true;
        document.getElementById('trackTitle').disabled = true;
        loader.style.display = 'block';
        status.innerText = "🎙️ Optimizing acoustic arrays... Please wait.";

        try {
            const response = await fetch('/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt, lyrics })
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || "Failed");
            
            audioPlayer.src = data.audioUrl;
            pTitle.innerText = titleInput; pStatus.innerText = "Ready to Play";
            status.innerHTML = "🎉 Master compilation ready for playback!"; audioPlayer.play();
            
            const uniqueId = "track-" + Date.now();
            const card = document.createElement('div'); 
            card.className = 'track-card';
            card.id = uniqueId;
            card.setAttribute('data-audio-src', data.audioUrl);
            card.setAttribute('data-track-title', titleInput);
            bindCardEvents(card);
            
            card.innerHTML = `
                <div class="card-wave-art"><div class="card-wave-bars"><div class="wave-bar"></div><div class="wave-bar" style="height:20px;"></div><div class="wave-bar"></div></div></div>
                <div class="card-details">
                    <div class="card-title">🔊 ${titleInput}</div>
                    <div class="card-style">${prompt.substring(0, 40)}...</div>
                </div>
                <div class="card-actions">
                    <a href="${data.audioUrl}" download="${titleInput}.mp3" class="action-icon-btn" onclick="event.stopPropagation();">💾 Download</a>
                    <button id="btn-lib-${uniqueId}" class="action-icon-btn" onclick="toggleWorkspace(event, '${uniqueId}')">📁 Add to Lib</button>
                    <button class="action-icon-btn" onclick="shareTrack(event, '${data.audioUrl}')">🔗 Share</button>
                </div>
            `;
            grid.insertBefore(card, grid.firstChild);
            saveCurrentLibraryState();
            showAllTracks();
        } catch (err) { status.innerText = "❌ Matrix Fault: " + err.message; } finally { 
            loader.style.display = 'none'; 
            validateFormTitle();
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        loadSavedLibraryAndInputs();
        validateFormTitle();
        
        document.getElementById('trackTitle').addEventListener('input', (e) => localStorage.setItem('muse_ai_draft_title', e.target.value));
        document.getElementById('prompt').addEventListener('input', (e) => localStorage.setItem('muse_ai_draft_prompt', e.target.value));
        document.getElementById('lyrics').addEventListener('input', (e) => localStorage.setItem('muse_ai_draft_lyrics', e.target.value));
    });
</script>
</body>
</html>
